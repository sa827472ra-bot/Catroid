name: Build APK Custom

on:
  workflow_dispatch: # Permite ativar a compilação com um clique manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Disponibilizar Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-catroid-apk
          path: catroid/build/outputs/apk/debug/*.apk
concurrency:
