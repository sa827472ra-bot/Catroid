name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleApktemplateDebug -x externalNativeBuildCleanApktemplateDebug -x :vncclient:externalNativeBuildCleanDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: catroid-apktemplate-debug
        # Caminho padrão onde o Gradle salva os APKs do módulo "catroid"
        path: catroid/build/outputs/apk/apktemplate/debug/**/*.apk 
